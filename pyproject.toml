[project]
name = "findoc-rag"
version = "0.1.0"
description = "Verifiable RAG for complex Chinese listed-company documents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx[socks]>=0.28",
    "numpy>=2.0",
    "pymupdf>=1.25",
    "pydantic>=2.9",
    "rank-bm25>=0.2.2",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
]
dense = [
    "sentence-transformers>=3.3",
]
ocr = [
    "onnxruntime>=1.22,<2",
    "pillow>=11",
    "rapidocr>=3.9,<4",
]
evaluation = [
    "datasets>=3.0",
    "ragas>=0.3,<0.4",
    "langchain>=0.3,<1",
    "langchain-community>=0.3,<0.4",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.3,<1",
    "pillow>=11",
    "wandb>=0.19",
]

[project.scripts]
findoc-rag = "findoc_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
