[project]
name = "findoc-rag"
version = "0.1.0"
description = "Verifiable RAG for complex Chinese listed-company documents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.9",
    "rank-bm25>=0.2.2",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
dense = [
    "sentence-transformers>=3.3",
]

[project.scripts]
findoc-rag = "findoc_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
