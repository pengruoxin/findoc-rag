name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Windows is not decorative here: the index/benchmark integrity checks hash a
    # payload in memory and re-hash it from disk, so any platform newline
    # translation turns a fail-closed check into a false positive. That class of
    # bug is invisible on Linux alone.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra api
      - run: uv run ruff check .
      - run: uv run pytest -q

  clean-clone-integrity:
    # The README claims a clean clone can verify the frozen benchmark. Prove it on
    # the platform where core.autocrlf defaults to true.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Verify committed benchmark assets against their external lock
        run: uv run python scripts/validate_benchmark_dataset.py
