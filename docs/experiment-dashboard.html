<!doctype html><meta charset="utf-8"><title>FinDocRAG Experiments</title>
<style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;background:#f6f7f9}article{background:#fff;padding:1rem;margin:1rem 0;border-radius:8px}code{background:#eee;padding:.15rem}</style>
<h1>FinDocRAG experiment registry</h1><p>Versioned experiment metadata and caveats. Scores are never shown without provenance.</p><main id="app">Loading…</main>
<script>fetch('https://raw.githubusercontent.com/pengruoxin/findoc-rag/main/reports/ranking/experiment-registry-v1.json').then(r=>r.json()).then(d=>document.querySelector('#app').innerHTML=d.runs.map(x=>`<article><h2>${x.run_id}</h2><p>Dataset: <code>${x.dataset}</code><br>Index: <code>${x.index_id}</code><br>Mode: ${x.mode}</p><p>Status: ${x.status}</p><p>${x.candidate_recall==null?'Metrics pending':`Candidate Recall ${x.candidate_recall} · Hit@5 ${x.hit_at_5} · MRR@5 ${x.mrr_at_5}`}</p><p><b>Caveat:</b> ${x.caveat}</p></article>`).join('')).catch(e=>document.querySelector('#app').textContent=e)</script>
