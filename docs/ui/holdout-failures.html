<!doctype html><meta charset="utf-8"><title>FinDocRAG Holdout Failures</title>
<style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;background:#f6f7f9}article{background:#fff;padding:1rem;margin:1rem 0;border-radius:8px}code{background:#eee;padding:.15rem}</style>
<h1>Holdout failure analysis</h1><p>Only runtime-generated failures are shown. Empty or missing reports are explicit.</p><main id="app">Loading…</main>
<script>fetch('https://raw.githubusercontent.com/pengruoxin/findoc-rag/main/reports/ranking/holdout-eval-v2-failures.json').then(r=>{if(!r.ok)throw Error('No runtime failure report yet');return r.json()}).then(d=>{let fs=d.failures||[];document.querySelector('#app').innerHTML=`<p>Failures: <b>${d.failure_count}</b></p>`+(fs.length?fs.map(x=>`<article><h2>${x.query_id}</h2><p>${x.explanation}</p><p>Type: <code>${x.failure_type}</code></p></article>`).join(''):'<p>No failures recorded.</p>')}).catch(e=>document.querySelector('#app').textContent=e)</script>
