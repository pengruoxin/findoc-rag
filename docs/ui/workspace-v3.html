<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinDocRAG</title><style>body{margin:0;background:#f4f7fb;color:#172033;font:15px system-ui}.wrap{max-width:980px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between}.query{display:flex;gap:8px;margin:40px 0 14px}.query input{flex:1;padding:13px;border:1px solid #cbd7e8;border-radius:10px}.query button{background:#3569dc;color:#fff;border:0;border-radius:9px;padding:0 20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;box-shadow:0 10px 30px #233b6510}.answer{border-top:4px solid #3569dc}.answer h1{font-size:26px}.muted{color:#748197}.fold{border-top:1px solid #e7ebf2;margin-top:16px;padding-top:13px}.fold summary{cursor:pointer;color:#315db3;font-weight:650}.evidence{background:#f8faff;padding:13px;margin-top:10px;border-radius:9px}.evidence pre{white-space:pre-wrap;font:12px/1.7 monospace}.notice{display:none;background:#fff4e5;padding:10px;color:#8a5a14;border-radius:8px}@media(max-width:650px){.wrap{padding:15px}.query{margin-top:25px}}</style><body><div class="wrap"><div class="top"><b>◈ FinDocRAG</b><span class="muted">API 模式 · Evidence-first</span></div><div class="query"><input id="q" value="贵州茅台 2024 年营业收入是多少"><button id="go">检索</button></div><div id="notice" class="notice"></div><section class="card answer"><div class="muted" id="state">点击检索开始</div><h1 id="answer">—</h1><div class="muted" id="source">答案会严格绑定检索证据</div><details class="fold"><summary>查看证据</summary><div id="evidence" class="evidence">暂无证据</div></details><details class="fold"><summary>查看检索过程</summary><div id="trace" class="muted">暂无 trace</div></details></section></div><script>const q=document.querySelector('#q'),n=document.querySelector('#notice');document.querySelector('#go').onclick=async()=>{n.style.display='none';document.querySelector('#state').textContent='检索与生成中…';try{const r=await fetch('/v1/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q.value,mode:'hybrid',top_k:5})});const d=await r.json();if(!r.ok)throw Error(d.error?.message||'请求失败');document.querySelector('#state').textContent='已完成';document.querySelector('#answer').textContent=d.answer;document.querySelector('#source').textContent=(d.citations||[]).length+' 条证据 · provider: '+d.provider;document.querySelector('#evidence').innerHTML=(d.citations||[]).map(x=>`<b>第 ${x.page_start}-${x.page_end} 页</b><br><span class="muted">${x.section_path.join(' > ')}</span><pre>${x.excerpt||'暂无原文摘录'}</pre><small>chunk: ${x.chunk_id}</small>`).join('<hr>')||'暂无证据';document.querySelector('#trace').textContent='grounded: '+d.grounded}catch(e){document.querySelector('#state').textContent='请求失败';n.textContent=e.message;n.style.display='block'}};q.onkeydown=e=>e.key==='Enter'&&document.querySelector('#go').click()</script></body></html>
